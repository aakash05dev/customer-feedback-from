<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Customer Feedback Form</h1>
    <p class="subtitle">We value your feedback!</p>

    <form id="feedbackForm">

        <!-- 1. Full Name -->
        <label>1. Full Name</label>
        <input type="text" id="fullName" required>

        <!-- 2. Email -->
        <label>2. Email Address</label>
        <input type="email" id="email" required>

        <!-- 3. Reason -->
        <label>3. Reason for Visit / Purchase</label>
        <div class="options">
            <label><input type="radio" name="reason" value="Product Purchase" required> Product Purchase</label>
            <label><input type="radio" name="reason" value="Customer Support"> Customer Support</label>
            <label><input type="radio" name="reason" value="Browsing / Research"> Browsing / Research</label>
            <label><input type="radio" name="reason" value="Other"> Other</label>
        </div>

        <!-- 4. Satisfaction -->
        <label>4. Overall Satisfaction</label>
        <div class="options">
            <label><input type="radio" name="satisfaction" value="1 - Very Dissatisfied" required> 1 - Very Dissatisfied</label>
            <label><input type="radio" name="satisfaction" value="2 - Dissatisfied"> 2 - Dissatisfied</label>
            <label><input type="radio" name="satisfaction" value="3 - Neutral"> 3 - Neutral</label>
            <label><input type="radio" name="satisfaction" value="4 - Satisfied"> 4 - Satisfied</label>
            <label><input type="radio" name="satisfaction" value="5 - Very Satisfied"> 5 - Very Satisfied</label>
        </div>

        <!-- 5. Ease of Use -->
        <label>5. Ease of Use / Navigation</label>
        <div class="options">
            <label><input type="radio" name="ease" value="Very Easy" required> Very Easy</label>
            <label><input type="radio" name="ease" value="Easy"> Easy</label>
            <label><input type="radio" name="ease" value="Neutral"> Neutral</label>
            <label><input type="radio" name="ease" value="Difficult"> Difficult</label>
            <label><input type="radio" name="ease" value="Very Difficult"> Very Difficult</label>
        </div>

        <!-- 6. Quality -->
        <label>6. Product / Service Quality</label>
        <div class="options">
            <label><input type="radio" name="quality" value="Excellent" required> Excellent</label>
            <label><input type="radio" name="quality" value="Good"> Good</label>
            <label><input type="radio" name="quality" value="Average"> Average</label>
            <label><input type="radio" name="quality" value="Poor"> Poor</label>
            <label><input type="radio" name="quality" value="Very Poor"> Very Poor</label>
        </div>

        <!-- 7. Staff Helpfulness -->
        <label>7. Staff / Customer Support Helpfulness</label>
        <div class="options">
            <label><input type="radio" name="helpfulness" value="N/A - No interaction" required> N/A - No interaction</label>
            <label><input type="radio" name="helpfulness" value="Extremely Helpful"> Extremely Helpful</label>
            <label><input type="radio" name="helpfulness" value="Somewhat Helpful"> Somewhat Helpful</label>
            <label><input type="radio" name="helpfulness" value="Unhelpful"> Unhelpful</label>
        </div>

        <!-- 8. Recommendation -->
        <label>8. How likely are you to recommend us to a friend?</label>
        <input type="number" id="recommend" min="0" max="10" required>
        <small>Score: 0 to 10</small>

        <!-- 9. Improvement -->
        <label>9. What can we improve?</label>
        <div class="options">
            <label><input type="checkbox" name="improve" value="Product Selection"> Product Selection</label>
            <label><input type="checkbox" name="improve" value="Pricing"> Pricing</label>
            <label><input type="checkbox" name="improve" value="Website / App"> Website / App</label>
            <label><input type="checkbox" name="improve" value="Delivery / Service Speed"> Delivery / Service Speed</label>
            <label><input type="checkbox" name="improve" value="Customer Support"> Customer Support</label>
        </div>

        <!-- 10. Comments -->
        <label>10. Additional Comments</label>
        <textarea id="comments" rows="5" placeholder="Enter your comments..."></textarea>

        <div class="buttons">
            <button type="submit">Submit Feedback</button>
            <button type="button" id="clearBtn">Clear Data</button>
        </div>

        <p id="message"></p>

    </form>
</div>

<script src="script.js"></script>
</body>
</html>
